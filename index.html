<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>ENTRENO</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ENTRENO" />
  <meta name="application-name" content="ENTRENO" />
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/entreno-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --tab-btn-h: 48px;
      --tab-bar-bg: #FFFFFF;
      /* Real iPhone insets only — no min(34px) floor, no extra 8–16px. Applied once each. */
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    /* Large viewport last: -webkit-fill-available maps to the small viewport on iOS and
       would leave a white void under the footer if it won the cascade. */
    html {
      margin: 0;
      overflow: hidden;
      background: var(--tab-bar-bg);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      height: 100lvh;
    }
    body, #root {
      margin: 0;
      overflow: hidden;
      background: var(--tab-bar-bg);
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      height: 100lvh;
    }
    #root { position: relative; }
    /* Tab bar in document flow at the physical bottom — not position:fixed vs a short viewport. */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      background: #EDEFF3;
    }
    .app-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      box-sizing: border-box;
      /* Insets live on the sticky header / tab bar, not here — applying them here doubles the bands. */
      padding-top: 0;
      padding-bottom: 0;
    }
    .app-tabs {
      flex: 0 0 auto;
      position: relative;
      left: auto;
      right: auto;
      bottom: auto;
      z-index: 1000;
      display: flex;
      align-items: stretch;
      width: 100%;
      height: auto;
      min-height: var(--tab-btn-h);
      margin: 0;
      padding: 0;
      padding-bottom: var(--sab);
      box-sizing: border-box;
      background: var(--tab-bar-bg);
      transform: none;
      filter: none;
    }
    .app-tabs button {
      flex: 1 1 0;
      box-sizing: border-box;
      min-height: var(--tab-btn-h);
      height: var(--tab-btn-h);
      padding: 0;
      margin: 0;
    }
    input, textarea { font-size: 16px !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
