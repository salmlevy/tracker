<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
  <title>ENTRENO</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ENTRENO" />
  <meta name="application-name" content="ENTRENO" />
  <meta name="theme-color" content="#EDEFF3" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/entreno-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      /* 44px de toque, más el home indicator. El scroll usa esta misma altura. */
      --tab-core: 44px;
      --tab-bar-bg: #FFFFFF;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --tab-bar-h: calc(var(--tab-core) + var(--sab));
      --kb: 0px;
      --vv-off: 0px;
      --sess-head-h: 0px;
      --kb-env: env(keyboard-inset-height, 0px);
      --c-bg: #EDEFF3;
      --c-card: #FFFFFF;
      --c-card2: #E3E7ED;
      --c-line: #CFD5DD;
      --c-txt: #0B0D10;
      --note-focus-bg: #FFFFFF;
      --note-focus-glow: #EDEFF3;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --c-bg: #0B0D10;
      --c-card: #171B21;
      --c-card2: #222830;
      --c-line: #2E3540;
      --c-txt: #F3F5F7;
      --tab-bar-bg: #171B21;
      --note-focus-bg: #222830;
      --note-focus-glow: #0B0D10;
    }
    html[data-theme="light"] { color-scheme: light; }
    /* 100dvh: el alto visible. 100lvh metía el logo detrás de la barra de Safari. */
    html {
      margin: 0;
      overflow: hidden;
      background: var(--c-bg);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      height: 100%;
      height: 100dvh;
    }
    body, #root {
      margin: 0;
      overflow: hidden;
      background: var(--c-bg);
      color: var(--c-txt);
      height: 100%;
      height: 100dvh;
    }
    #root { position: relative; }
    .app-shell {
      height: 100%;
      overflow: hidden;
      background: var(--c-bg);
    }
    .app-scroll {
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      box-sizing: border-box;
      padding-top: 0;
      padding-bottom: calc(var(--tab-bar-h) + var(--kb, 0px) + var(--kb-env, 0px));
      overflow-anchor: none;
    }
    .app-tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      width: 100%;
      height: var(--tab-bar-h);
      margin: 0;
      padding: 0;
      padding-bottom: var(--sab);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      box-sizing: border-box;
      background: var(--tab-bar-bg);
      box-shadow: inset 0 1px 0 var(--c-line);
      transform: none;
      filter: none;
    }
    /* Note focused / keyboard up: footer goes below the keys so it cannot cover the field.
       z-index on the textarea cannot beat this bar (different stacking context). */
    html.kb-open .app-tabs {
      bottom: calc(-1 * var(--tab-bar-h) - 24px);
      transform: none;
      pointer-events: none;
      visibility: hidden;
    }
    /* The focused note is position:fixed on document.body (see dockNote).
       Do not pad the scroller by half a screen: that hid the field under the keys on iOS. */
    .app-tabs button {
      flex: 1 1 0;
      box-sizing: border-box;
      height: var(--tab-core);
      min-height: 44px;
      max-height: 44px;
      padding: 0 4px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    input, textarea { font-size: 16px !important; }
    .note-field { scroll-margin-bottom: 16px; scroll-margin-top: calc(var(--sess-head-h, 0px) + 12px); }
    .note-field:focus {
      background: var(--note-focus-bg);
      box-shadow: 0 0 0 10px var(--note-focus-glow);
    }
    /* WebKit pinta "Seleccionar archivo" aunque el input tenga opacity casi 0. */
    .clip-file,
    .clip-file::file-selector-button,
    .clip-file::-webkit-file-upload-button {
      color: transparent;
      -webkit-text-fill-color: transparent;
      background: transparent;
      border: 0;
    }
    [data-ex-id] { scroll-margin-top: calc(var(--sess-head-h, 96px) + 8px); }
    /* Fuera de .app-scroll: en iPhone el sticky dentro del scroller dejaba un hueco negro al subir. */
    .sess-head {
      position: fixed;
      top: var(--vv-off, 0px);
      left: 0;
      right: 0;
      z-index: 40;
    }
    .sess-head-spacer { height: var(--sess-head-h, 96px); min-height: 96px; }
    .home-head {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 8;
      box-sizing: border-box;
      min-height: calc(44px + var(--sat));
      background: var(--c-bg);
    }
    .theme-btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      margin: 0 -8px 0 0;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      opacity: 0.52;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .theme-btn:active {
      opacity: 0.88;
      background: color-mix(in srgb, currentColor 14%, transparent);
    }
    .theme-btn svg { display: block; pointer-events: none; }
  </style>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("trk_gymu_theme_v1");
        var mode = "system";
        if (raw) {
          try { mode = JSON.parse(raw); } catch (e) { mode = raw; }
        }
        var dark = mode === "dark" || (mode !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0B0D10" : "#EDEFF3");
      } catch (e) {}
    })();
    /* --sat y --sab siguen a env(safe-area-inset-*). En Safari suelen ser 0
       (las barras ya apartan el viewport). En la app de inicio, viewport-fit=cover
       los necesita para el notch y el home indicator. No los fuerces a 0. */
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
