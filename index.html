<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>ENTRENO</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ENTRENO" />
  <meta name="application-name" content="ENTRENO" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/entreno-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      background: #EDEFF3;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      /* no transform/filter/contain: those make position:fixed attach to the wrong box */
    }
    #root {
      height: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .app-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .app-tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      flex-shrink: 0;
      width: 100%;
      transform: none;
      filter: none;
    }
    input, textarea { font-size: 16px !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
