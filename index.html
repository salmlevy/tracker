<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>ENTRENO</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ENTRENO" />
  <meta name="application-name" content="ENTRENO" />
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/entreno-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --tab-btn-h: 48px;
      --tab-bar-bg: #FFFFFF;
      /* Buttons + top border + real iPhone inset. JS overwrites with measured nav height when > 0. */
      --tab-bar-h: calc(var(--tab-btn-h) + 2px + env(safe-area-inset-bottom, 0px));
    }
    /* Large viewport only — 100svh ends above the home indicator and leaves a white void under a bottom:0 bar. */
    html {
      margin: 0;
      overflow: hidden;
      background: var(--tab-bar-bg);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      height: 100%;
      height: 100dvh;
      height: 100lvh;
      height: -webkit-fill-available;
      min-height: 100%;
      min-height: 100dvh;
      min-height: 100lvh;
      min-height: -webkit-fill-available;
    }
    body, #root {
      margin: 0;
      overflow: hidden;
      background: var(--tab-bar-bg);
      height: 100%;
      height: 100dvh;
      height: 100lvh;
      height: -webkit-fill-available;
      min-height: 100%;
      min-height: 100dvh;
      min-height: 100lvh;
      min-height: -webkit-fill-available;
    }
    #root { position: relative; }
    /* Bounded scroller: html/body/#root are overflow:hidden, so this must have a definite height. */
    .app-scroll {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      box-sizing: border-box;
      padding-bottom: var(--tab-bar-h);
    }
    .app-tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      display: flex;
      align-items: stretch;
      width: 100%;
      height: auto;
      margin: 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-sizing: border-box;
      background: var(--tab-bar-bg);
      transform: none;
      filter: none;
    }
    .app-tabs button {
      flex: 1 1 0;
      min-height: var(--tab-btn-h);
      height: var(--tab-btn-h);
      padding: 0;
      margin: 0;
    }
    input, textarea { font-size: 16px !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
