<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>ENTRENO</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ENTRENO" />
  <meta name="application-name" content="ENTRENO" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/entreno-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --tab-btn-h: 48px;
      /* Real inset only — no min(34px) floor. JS overwrites with measured nav height. */
      --tab-bar-h: calc(var(--tab-btn-h) + env(safe-area-inset-bottom, 0px));
    }
    html {
      margin: 0;
      height: 100%;
      height: 100svh;
      height: -webkit-fill-available;
      min-height: 100svh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background: #EDEFF3;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    body, #root {
      margin: 0;
      min-height: 100svh;
      min-height: -webkit-fill-available;
      height: 100%;
      height: 100svh;
      height: -webkit-fill-available;
      overflow: hidden;
      background: #EDEFF3;
    }
    #root { position: relative; }
    .app-scroll {
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-sizing: border-box;
      padding-bottom: var(--tab-bar-h);
    }
    .app-tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      display: flex;
      align-items: stretch;
      width: 100%;
      height: auto;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-sizing: border-box;
      transform: none;
      filter: none;
    }
    .app-tabs button {
      flex: 1 1 0;
      min-height: var(--tab-btn-h);
      height: var(--tab-btn-h);
      padding: 0;
      margin: 0;
    }
    input, textarea { font-size: 16px !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
