<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>ENTRENO</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ENTRENO" />
  <meta name="application-name" content="ENTRENO" />
  <meta name="theme-color" content="#EDEFF3" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/entreno-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      /* One short bar. Labels live IN the home-indicator zone — never 48px + --sab. */
      --tab-bar-h: 48px;
      --tab-bar-bg: #FFFFFF;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      /* At most ~8px under the words. Never a full env(safe-area-inset-bottom) strip. */
      --tab-pad-b: min(8px, env(safe-area-inset-bottom, 0px));
      --kb: 0px;
    }
    /* 100lvh last so the bar pins to the physical bottom. Do not use 100svh. */
    html {
      margin: 0;
      overflow: hidden;
      background: #EDEFF3;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      height: 100%;
      height: 100dvh;
      height: 100lvh;
    }
    body, #root {
      margin: 0;
      overflow: hidden;
      background: #EDEFF3;
      height: 100%;
      height: 100dvh;
      height: 100lvh;
    }
    #root { position: relative; }
    .app-shell {
      height: 100%;
      overflow: hidden;
      background: #EDEFF3;
    }
    .app-scroll {
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      box-sizing: border-box;
      padding-top: 0;
      padding-bottom: calc(var(--tab-bar-h) + var(--kb, 0px));
      overflow-anchor: none;
    }
    /* Fixed to the physical bottom. Height is the WHOLE chrome including any inset overlap. */
    .app-tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: stretch;
      width: 100%;
      height: var(--tab-bar-h);
      min-height: 44px;
      max-height: 50px;
      margin: 0;
      padding: 0;
      padding-bottom: var(--tab-pad-b);
      box-sizing: border-box;
      background: var(--tab-bar-bg);
      transform: none;
      filter: none;
    }
    .app-tabs button {
      flex: 1 1 0;
      box-sizing: border-box;
      height: 100%;
      min-height: 0;
      padding: 0;
      margin: 0;
    }
    input, textarea { font-size: 16px !important; }
    .note-field { scroll-margin-bottom: calc(var(--kb, 0px) + 24px); }
  </style>
  <script>
    /* --sat = env(safe-area-inset-top) only when the layout viewport actually overlaps the
       notch/status bar. If the viewport already starts below the clock (Safari chrome),
       force 0 — do not paint a second empty band. */
    (function () {
      var root = document.documentElement;
      function envPad(expr) {
        var d = document.createElement("div");
        d.style.cssText = "position:absolute;visibility:hidden;pointer-events:none;padding-top:" + expr;
        root.appendChild(d);
        var n = d.clientHeight;
        root.removeChild(d);
        return n;
      }
      function apply() {
        var sat = envPad("env(safe-area-inset-top, 0px)");
        if (!(sat > 0)) return;
        var standalone = (window.navigator && window.navigator.standalone) ||
          (window.matchMedia && (window.matchMedia("(display-mode: standalone)").matches ||
            window.matchMedia("(display-mode: fullscreen)").matches));
        var inner = window.innerHeight || 0;
        var screenH = (window.screen && window.screen.height) || 0;
        var overlaps = standalone || (screenH > 0 && inner + 12 >= screenH);
        if (!overlaps) root.style.setProperty("--sat", "0px");
        else root.style.removeProperty("--sat");
      }
      apply();
      window.addEventListener("resize", apply);
      window.addEventListener("orientationchange", apply);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
